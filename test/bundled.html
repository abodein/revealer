<!doctype html><html><head><meta charset="utf-8"><title>Bundled deck (no global Reveal)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.css"></head>
<body><div class="reveal"><div class="slides">
<section>Slide 1<aside class="notes">Note one</aside></section><section>Slide 2</section>
</div></div>
<script type="module">
import Reveal from "https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/dist/reveal.esm.js";
import Notes from "https://cdn.jsdelivr.net/npm/reveal.js@5.1.0/plugin/notes/notes.esm.js";
new Reveal({ plugins: [Notes] }).initialize();
</script></body></html>
